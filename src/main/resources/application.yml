spring:
  ai:
    mcp:
      server:
        name: mcp-database-server
        version: 1.0.0
        protocol: STREAMABLE
        webflux: false
#          enabled: false  # Explicitly disable default WebFlux transport
        stdio: false
        type: sync
#        keep-alive-interval: 30s
        streamable-http:
#          keep-alive-interval: 30s
          mcp-endpoint: /mcp


  application:
    name: mcp-database-server
  main:
    banner-mode: console
    allow-bean-definition-overriding: true
server:
  port: 6789

# SQL安全控制配置
sql:
  security:
    # 是否启用SQL安全检查
    enabled: false
    # 危险操作关键字配置（不区分大小写）
    dangerous-keywords:
      # DML危险操作
      - update
      - delete
      - insert
      - replace
      # DDL危险操作
      - drop
      - create
      - alter
      - truncate
      # DCL危险操作
      - grant
      - revoke
      # 系统操作
      - shutdown
      - restart
      # 存储过程相关
      - call
      - execute
      # 事务控制
      - commit
      - rollback
      # 用户自定义危险关键字可在此添加
      # - custom_keyword
logging:
  file:
    name: logs/mcp-server.log
  level:
    root: INFO
    org.jim: INFO
    org.springframework: INFO
    com.zaxxer.hikari: INFO
#    io.modelcontextprotocol.util.KeepAliveScheduler: ERROR
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
