spring:
  ai:
    mcp:
      server:
        name: mcp-database-server
        version: 1.0.0
        protocol: STREAMABLE
        stdio: false
        type: SYNC
        streamable-http:
          mcp-endpoint: /mcp
#          keep-alive-interval: 30s


  application:
    name: mcp-database-server
  main:
    banner-mode: console
    allow-bean-definition-overriding: true
server:
  port: 6789

# 数据源运行期配置
datasource:
  # 重载时摘除数据源后，延迟关闭其连接池的宽限秒数。
  # HikariCP 的 close() 会强杀在途连接，留出宽限期让正在执行的查询跑完。设为 0 表示立即关闭。
  reload-grace-seconds: 30

# SQL安全控制配置
sql:
  security:
    # 是否启用SQL安全检查
    enabled: false
    # 危险操作关键字配置（不区分大小写）
    dangerous-keywords:
      # DML危险操作
      - update
      - delete
      - insert
      - replace
      # DDL危险操作
      - drop
      - create
      - alter
      - truncate
      # DCL危险操作
      - grant
      - revoke
      # 系统操作
      - shutdown
      - restart
      # 存储过程相关
      - call
      - execute
      # 事务控制
      - commit
      - rollback
      # 用户自定义危险关键字可在此添加
      # - custom_keyword
tool:
  response-limit:
    # 是否启用 SQL 结果截断与续取
    enabled: true
    # 单次 tool 回包允许的最大字符数
    max-chars: 12000
    # 缓存中最多保留的截断结果数量
    cache-max-entries: 100
    # 截断结果缓存时长，单位分钟
    cache-ttl-minutes: 10
    # 首次预览至少返回的行数
    min-preview-rows: 1
logging:
  file:
    name: logs/mcp-server.log
  level:
    root: INFO
    org.jim: INFO
    org.springframework: INFO
    com.zaxxer.hikari: INFO
#    io.modelcontextprotocol.util.KeepAliveScheduler: ERROR
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
